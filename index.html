<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doin — Leave Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15130C; --ink-soft:#514B3B; --ink-mute:#93897A;
  --paper:#F6F4EE; --card:#FFFFFF; --line:#E4DFD1; --line-soft:#EFEBE0;
  --teal:#F2B705; --teal-dark:#141414; --teal-tint:#FFF6D9;
  --amber:#C1841F; --amber-tint:#FBF0DD;
  --rust:#C23B3B; --rust-tint:#FBE9E9;
  --slate:#5B6B7A; --slate-tint:#EAF0F5;
  --pink:#A8517A;
  --coral:#B2673F;
  --purple:#6A5B9E;
  --success:#2E8B57; --success-tint:#E4F3EA;
  --on-brand:#141414;
  --radius:10px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3,.serif{font-family:'Fraunces',serif;}
button{font-family:'Inter',sans-serif;cursor:pointer;}
::selection{background:var(--teal-tint);}

.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh;}
.side{background:var(--teal-dark);color:#EFF5F1;padding:26px 18px;display:flex;flex-direction:column;gap:4px;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:28px;padding:0 8px;}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--teal);color:var(--on-brand);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:15px;}
.brand-logo{height:26px;width:auto;display:block;}
.brand-name{font-family:'Fraunces',serif;font-size:17px;letter-spacing:.2px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#C7D4EA;font-size:14px;font-weight:500;background:none;border:none;text-align:left;width:100%;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(242,183,5,.16);color:#F2B705;}
.nav-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex-shrink:0;}
.side-foot{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:#8FA3C7;}

.role-switch{margin:18px 8px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8FAFA0;}
.role-pills{display:flex;flex-direction:column;gap:6px;margin:0 4px 20px;}
.role-pill{padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:#D6E0F2;font-size:13px;text-align:left;}
.role-pill.active{background:var(--teal);color:var(--on-brand);border-color:var(--teal);font-weight:700;}

.main{padding:30px 40px 60px;max-width:1180px;}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px;}
.topbar h1{font-size:26px;font-weight:500;margin:0 0 4px;}
.topbar p{margin:0;color:var(--ink-soft);font-size:14px;}
.who{text-align:right;font-size:13px;color:var(--ink-soft);}
.who b{color:var(--ink);}

.grid{display:grid;gap:14px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:2fr 1fr;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;}
.metric-label{font-size:12px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px;}
.metric-val{font-size:26px;font-weight:500;font-family:'Fraunces',serif;margin:0;}
.metric-sub{font-size:12px;color:var(--ink-mute);margin-top:4px;}

.section-title{font-size:15px;font-weight:600;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;}
.section-title span.count{font-weight:400;color:var(--ink-mute);font-size:13px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-weight:600;color:var(--ink-soft);padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px;text-transform:uppercase;letter-spacing:.04em;}
td{padding:10px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.emp-cell{display:flex;align-items:center;gap:9px;}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--teal-tint);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;}

.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
.badge.pending_manager{background:var(--amber-tint);color:#8A5C11;}
.badge.pending_hr{background:var(--slate-tint);color:#3E4E5C;}
.badge.pending{background:var(--amber-tint);color:#8A5C11;}
.badge.approved{background:var(--success-tint);color:var(--success);}
.badge.rejected{background:var(--rust-tint);color:#8A3325;}
.leave-tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-soft);}
.leave-dot{width:7px;height:7px;border-radius:50%;}

.btn{border-radius:8px;border:1px solid var(--line);background:#fff;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink);}
.btn:hover{background:var(--line-soft);}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--on-brand);font-weight:700;}
.btn.primary:hover{background:#D9A100;border-color:#D9A100;}
.btn.ghost{border:none;background:none;color:var(--ink-soft);}
.btn.approve{border-color:var(--success);color:var(--success);}
.btn.reject{border-color:var(--rust);color:#8A3325;}
.btn.sm{padding:4px 9px;font-size:11.5px;}

.form-row{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.form-row label{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
select,input[type=date],input[type=text],input[type=email],input[type=number],textarea{padding:9px 10px;border-radius:8px;border:1px solid var(--line);font-family:'Inter',sans-serif;font-size:13.5px;background:#fff;color:var(--ink);}
textarea{resize:vertical;min-height:64px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

.balance-bar{height:6px;border-radius:4px;background:var(--line-soft);overflow:hidden;margin-top:6px;}
.balance-fill{height:100%;background:var(--teal);}

.empty{color:var(--ink-mute);font-size:13px;padding:20px 4px;text-align:center;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:50;max-width:360px;}
.toast.show{opacity:1;transform:translateY(0);}

.search{padding:8px 12px;border-radius:8px;border:1px solid var(--line);font-size:13px;width:220px;}

.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-soft);margin:10px 0 4px;flex-wrap:wrap;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;}
.cal-head{font-size:11px;color:var(--ink-mute);text-align:center;padding:4px 0;}
.cal-cell{aspect-ratio:1;border-radius:6px;background:var(--line-soft);position:relative;font-size:10.5px;color:var(--ink-mute);padding:4px;}
.cal-cell.on{background:var(--success);color:#fff;}
.cal-cell.blank{background:transparent;}

.login-shell{max-width:420px;margin:60px auto;padding:0 20px;}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px;}
.login-logo{height:34px;display:block;margin:0 auto 22px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
.field input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);font-family:'Inter',sans-serif;font-size:14px;}
.err-box{background:var(--rust-tint);color:#8A3325;border:1px solid var(--rust);border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;display:none;}
.ok-box{background:var(--success-tint);color:var(--success);border:1px solid var(--success);border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);}

@media (max-width:900px){
  .shell{grid-template-columns:1fr;}
  .side{flex-direction:row;flex-wrap:wrap;}
  .g4{grid-template-columns:repeat(2,1fr);}
  .g3{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
}
</style>
</head>

/* ---------- config ---------- */
const API_BASE = localStorage.getItem('doin_api_base') || '';

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => t.classList.remove('show'), 3200);
}

async function api(path, opts = {}) {
  const token = localStorage.getItem('doin_token');
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
  if (res.status === 401 && path !== '/auth/login') {
    localStorage.removeItem('doin_token');
    state.user = null;
    renderLogin();
    throw new Error('Your session ended. Please sign in again.');
  }
  let data = null;
  const text = await res.text();
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
  if (!res.ok) throw new Error((data && data.error) || `Request failed (${res.status})`);
  return data;
}

let state = {
  configured: !!API_BASE, user: null, mustResetPassword: false,
  view: 'dashboard', search: '',
  calMonth: new Date().getMonth(), calYear: new Date().getFullYear()
};

const LEAVE_TYPE_COLOR = {
  annual: 'var(--teal)', sick: 'var(--amber)', casual: 'var(--slate)',
  maternity: 'var(--pink)', paternity: 'var(--coral)', special: 'var(--purple)', unpaid: 'var(--ink-mute)'
};
const DOC_TYPE_LABELS = { salary_certificate: 'Salary Certificate', noc: 'NOC', employment_certificate: 'Employment Certificate', other: 'Other' };

function fmt(d) { return d.toISOString().slice(0, 10); }
function initials(name) { return name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase(); }
function avatarHtml(name, photo, size) {
  const s = size || 28;
  if (photo) return `<img class="avatar" src="${photo}" style="width:${s}px;height:${s}px;object-fit:cover;" alt="${name}">`;
  return `<div class="avatar" style="width:${s}px;height:${s}px;">${initials(name)}</div>`;
}
function resizeImageFile(file, maxDim) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read that file.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("That file doesn't look like a valid image."));
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function uploadPhotoFor(employeeId, file, onDone) {
  if (!file) return;
  if (!file.type.startsWith('image/')) { toast('Please choose an image file.'); return; }
  try {
    const dataUrl = await resizeImageFile(file, 200);
    await api(`/employees/${employeeId}/photo`, { method: 'PATCH', body: JSON.stringify({ photo: dataUrl }) });
    toast('Photo updated.');
    if (onDone) onDone(dataUrl);
  } catch (e) { toast(e.message); }
}

/* ---------- boot ---------- */
async function boot() {
  if (!state.configured) { renderConfigScreen(); return; }
  const token = localStorage.getItem('doin_token');
  if (!token) { renderLogin(); return; }
  try {
    const me = await api('/auth/me');
    state.user = me;
    renderShell();
  } catch (e) { renderLogin(); }
}

function renderConfigScreen() {
  document.getElementById('app').innerHTML = `
    <div class="center-screen"><div class="login-shell"><div class="login-card">
      <img class="login-logo" src="${DOIN_LOGO_DATA_URI}" alt="Doin">
      <h2 class="serif" style="margin:0 0 6px;font-size:18px;">Connect to your API</h2>
      <p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 16px;">Enter the backend URL this portal should talk to. You only need to do this once per browser.</p>
      <div class="field"><label>API base URL</label><input id="apiBaseInput" placeholder="https://your-service.onrender.com/api"></div>
      <button class="btn primary" id="saveApiBase" style="width:100%;">Continue</button>
    </div></div></div>`;
  document.getElementById('saveApiBase').addEventListener('click', () => {
    const v = document.getElementById('apiBaseInput').value.trim().replace(/\/$/, '');
    if (!v) { toast('Enter a URL.'); return; }
    localStorage.setItem('doin_api_base', v);
    location.reload();
  });
}

function renderLogin() {
  document.getElementById('app').innerHTML = `
    <div class="center-screen"><div class="login-shell"><div class="login-card">
      <img class="login-logo" src="${DOIN_LOGO_DATA_URI}" alt="Doin">
      <div class="err-box" id="loginErr"></div>
      <div class="field"><label>Work email</label><input id="loginEmail" type="email" autocomplete="username"></div>
      <div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
      <button class="btn primary" id="loginBtn" style="width:100%;">Sign in</button>
      <p style="font-size:11px;color:var(--ink-mute);margin:14px 0 0;text-align:center;"><a href="#" id="reconfigureLink" style="color:var(--ink-mute);">Change API server</a></p>
    </div></div></div>`;
  document.getElementById('reconfigureLink').addEventListener('click', (e) => { e.preventDefault(); localStorage.removeItem('doin_api_base'); location.reload(); });
  const doLogin = async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const btn = document.getElementById('loginBtn');
    const errBox = document.getElementById('loginErr');
    errBox.style.display = 'none';
    if (!email || !password) { errBox.textContent = 'Enter your email and password.'; errBox.style.display = 'block'; return; }
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Signing in…';
    try {
      const res = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
      localStorage.setItem('doin_token', res.token);
      state.user = res.user;
      state.mustResetPassword = res.mustResetPassword;
      if (state.mustResetPassword) renderForcedReset(); else renderShell();
    } catch (e) {
      errBox.textContent = e.message || 'Sign in failed.';
      errBox.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  };
  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}

function renderForcedReset() {
  document.getElementById('app').innerHTML = `
    <div class="center-screen"><div class="login-shell"><div class="login-card">
      <img class="login-logo" src="${DOIN_LOGO_DATA_URI}" alt="Doin">
      <h2 class="serif" style="margin:0 0 6px;font-size:18px;">Set a new password</h2>
      <p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 16px;">Your account is still on a temporary password. Choose a new one — at least 8 characters.</p>
      <div class="err-box" id="resetErr"></div>
      <div class="field"><label>New password</label><input id="newPw" type="password" autocomplete="new-password"></div>
      <div class="field"><label>Confirm new password</label><input id="newPw2" type="password" autocomplete="new-password"></div>
      <button class="btn primary" id="resetBtn" style="width:100%;">Set password and continue</button>
    </div></div></div>`;
  document.getElementById('resetBtn').addEventListener('click', async () => {
    const p1 = document.getElementById('newPw').value, p2 = document.getElementById('newPw2').value;
    const errBox = document.getElementById('resetErr'); errBox.style.display = 'none';
    if (p1.length < 8) { errBox.textContent = 'Password must be at least 8 characters.'; errBox.style.display = 'block'; return; }
    if (p1 !== p2) { errBox.textContent = 'Passwords do not match.'; errBox.style.display = 'block'; return; }
    try {
      await api('/auth/change-password', { method: 'POST', body: JSON.stringify({ newPassword: p1 }) });
      state.mustResetPassword = false; toast('Password updated.'); renderShell();
    } catch (e) { errBox.textContent = e.message; errBox.style.display = 'block'; }
  });
}

function renderWhoCard() {

function renderChangePasswordModal() {
  document.getElementById('main').innerHTML = topbar('Change password', 'Update your account password.') + `
    <div class="card" style="max-width:420px;">
      <div class="err-box" id="cpErr"></div>
      <div class="field"><label>Current password</label><input id="cpCurrent" type="password"></div>
      <div class="field"><label>New password</label><input id="cpNew" type="password"></div>
      <button class="btn primary" id="cpSave">Update password</button>
    </div>`;

async function renderView() {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));
  const main = document.getElementById('main');
  main.innerHTML = `<div class="topbar"><div><h1 class="serif">Loading…</h1></div></div>`;
  try {
    if (state.view === 'dashboard') await viewDashboard();
    else if (state.view === 'apply') await viewApply();
    else if (state.view === 'requests') await viewRequests();
    else if (state.view === 'onleave') await viewOnLeave();
    else if (state.view === 'documents') await viewDocuments();
    else if (state.view === 'team') await viewTeam();
    else if (state.view === 'calendar') await viewCalendar();
    else if (state.view === 'holidays') await viewHolidays();
  } catch (e) {
    main.innerHTML = `<div class="topbar"><div><h1 class="serif">Something went wrong</h1><p>${e.message}</p></div></div>`;
  }
  await refreshBadges();
}

async function refreshBadges() {
  try {
    const reqs = await api('/requests');
    let n = 0;
    if (state.user.role === 'manager') n = reqs.filter(r => r.status === 'pending_manager').length;
    else if (state.user.role === 'hr') n = reqs.filter(r => r.status === 'pending_hr').length;
    const badge = document.getElementById('reqNavBadge');
    if (badge) { badge.style.display = n > 0 ? 'inline-block' : 'none'; badge.textContent = n; }
  } catch (e) {}
  try {
    const docs = await api('/documents');
    const n = state.user.role === 'hr' ? docs.filter(d => d.status === 'pending').length : 0;
    const badge = document.getElementById('docNavBadge');
    if (badge) { badge.style.display = n > 0 ? 'inline-block' : 'none'; badge.textContent = n; }
  } catch (e) {}
}

function topbar(title, sub) {
  return `<div class="topbar"><div><h1 class="serif">${title}</h1><p>${sub}</p></div>
    <div class="who"><b>${state.user.name}</b><br><span style="text-transform:capitalize;">${state.user.role}</span> · ${state.user.dept}</div></div>`;
}
function badgeEl(status) {
  const labels = { pending_manager: 'Awaiting manager', pending_hr: 'Awaiting HR', approved: 'Approved', rejected: 'Rejected', pending: 'Pending' };
  return `<span class="badge ${status}">${labels[status] || status}</span>`;
}
function leaveTag(type, label) {
  return `<span class="leave-tag"><span class="leave-dot" style="background:${LEAVE_TYPE_COLOR[type] || 'var(--slate)'}"></span>${label}</span>`;
}

/* ---------- dashboard ---------- */
async function viewDashboard() {
  const [reqs, balances, employees] = await Promise.all([api('/requests'), api('/employees/me/balances'), api('/employees')]);

  let rolloverBanner = '';
  if (state.user.role === 'hr') {
    try {
      const status = await api('/admin/rollover-status');
      if (status.dueForRollover) {
        rolloverBanner = `<div class="card" style="background:var(--amber-tint);border-color:var(--amber);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:14px;">
          <div><b style="color:#8A5C11;">Year-end rollover hasn't run for ${status.currentYear} yet.</b>
          <div style="font-size:12.5px;color:#8A5C11;margin-top:2px;">Running it resets everyone's "used" balances to 0 for the new year and carries forward a few unused annual days.</div></div>
          <button class="btn primary" id="runRolloverBtn" style="white-space:nowrap;">Run rollover</button>
        </div>`;
      }
    } catch (e) {}
  }

  const pendingMine = reqs.filter(r => r.status === 'pending_manager' || (r.status === 'pending_hr' && r.employeeId === state.user.id)).length;
  const pendingForMe = state.user.role === 'manager' ? reqs.filter(r => r.status === 'pending_manager').length
    : state.user.role === 'hr' ? reqs.filter(r => r.status === 'pending_hr').length : 0;

  const today = fmt(new Date());
  let onLeaveToday = [];
  try { onLeaveToday = await api(`/requests/on-leave-now`); } catch (e) {}

  const cards = `<div class="grid g4">
    <div class="card"><p class="metric-label">Team headcount</p><p class="metric-val">${employees.length}</p><p class="metric-sub">across the company</p></div>
    <div class="card"><p class="metric-label">On leave today</p><p class="metric-val">${onLeaveToday.length}</p><p class="metric-sub">${onLeaveToday.slice(0,3).map(r=>r.name.split(' ')[0]).join(', ')||'—'}</p></div>
    <div class="card"><p class="metric-label">${state.user.role === 'employee' ? 'Your pending requests' : state.user.role === 'manager' ? 'Awaiting your review' : 'Awaiting HR sign-off'}</p><p class="metric-val">${state.user.role === 'employee' ? pendingMine : pendingForMe}</p><p class="metric-sub">${state.user.role === 'employee' ? 'in the approval chain' : 'action needed'}</p></div>
    <div class="card"><p class="metric-label">Your annual balance</p><p class="metric-val">${(balances.annual?.total ?? 0) - (balances.annual?.used ?? 0)}</p><p class="metric-sub">of ${balances.annual?.total ?? 0} days left</p></div>
  </div>`;

  const balanceCard = `<div class="card"><div class="section-title">Your leave balance</div>
    ${Object.entries(balances).filter(([k])=>k!=='unpaid').map(([k, b]) => {
      const left = b.total - b.used, pct = b.total ? Math.round((b.used / b.total) * 100) : 0;
      return `<div style="margin-bottom:14px;"><div style="display:flex;justify-content:space-between;font-size:13px;"><span>${b.label}</span><span style="color:var(--ink-mute)">${left} of ${b.total} left</span></div><div class="balance-bar"><div class="balance-fill" style="width:${pct}%"></div></div></div>`;
    }).join('')}
  </div>`;

  const recent = reqs.slice(0, 6);
  const recentCard = `<div class="card"><div class="section-title">Recent requests <span class="count">${recent.length}</span></div>
    <table><thead><tr>${state.user.role !== 'employee' ? '<th>Employee</th>' : ''}<th>Type</th><th>Dates</th><th>Status</th></tr></thead><tbody>
    ${recent.length ? recent.map(r => `<tr>${state.user.role !== 'employee' ? `<td>${r.employeeName}</td>` : ''}<td>${leaveTag(r.type, r.type[0].toUpperCase()+r.type.slice(1))}</td><td>${r.start} → ${r.end}</td><td>${badgeEl(r.status)}</td></tr>`).join('') : `<tr><td class="empty" colspan="4">No requests yet.</td></tr>`}
    </tbody></table></div>`;

  document.getElementById('main').innerHTML = topbar('Dashboard', state.user.role === 'hr' ? 'Company-wide leave overview.' : state.user.role === 'manager' ? 'Your team at a glance.' : 'Your leave summary.') + rolloverBanner + cards + `<div class="grid g3" style="margin-top:14px;">${recentCard}${balanceCard}</div>`;

  const rolloverBtn = document.getElementById('runRolloverBtn');
  if (rolloverBtn) {
    rolloverBtn.addEventListener('click', async () => {
      if (!confirm("This resets every employee's used leave to 0 for the new year and carries forward up to 5 unused annual days. Continue?")) return;
      rolloverBtn.disabled = true; rolloverBtn.innerHTML = '<span class="spinner"></span>Running…';
      try {
        const result = await api('/admin/rollover', { method: 'POST' });
        toast(`Rollover complete for ${result.year} — ${result.employeesProcessed} employees updated.`);
        viewDashboard();
      } catch (e) { toast(e.message); rolloverBtn.disabled = false; rolloverBtn.textContent = 'Run rollover'; }
    });
  }
}

async function viewApply() {
  const [balances, leaveTypes] = await Promise.all([api('/employees/me/balances'), api('/leave-types')]);
  const eligible = leaveTypes.filter(t => t.code !== 'unpaid' && (!t.gender_restricted || t.gender_restricted === state.user.gender));
  const today = fmt(new Date());
  document.getElementById('main').innerHTML = topbar('Apply for leave', 'Submit a new request for approval.') + `
    <div class="card" style="max-width:560px;">
      <div class="err-box" id="applyErr"></div>
      <div class="form-grid">
        <div class="form-row"><label>Leave type</label><select id="applyType">${eligible.map(t => { const b = balances[t.code]; return `<option value="${t.code}">${t.label} — ${b.total-b.used} left</option>`; }).join('')}</select></div>
        <div class="form-row"><label>&nbsp;</label><div style="font-size:12.5px;color:var(--ink-mute);padding-top:9px;">Need unpaid leave recorded? Contact HR directly.</div></div>
        <div class="form-row"><label>Start date</label><input type="date" id="applyStart" value="${today}"></div>
        <div class="form-row"><label>End date</label><input type="date" id="applyEnd" value="${today}"></div>
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin:-6px 0 10px;cursor:pointer;">
        <input type="checkbox" id="applyHalfDay" style="width:15px;height:15px;"> Half day (deducts 0.5 — only for a single date)
      </label>
      <div id="daysNote" style="font-size:12.5px;color:var(--ink-mute);margin:-2px 0 14px;"></div>
      <div class="form-row"><label>Reason</label><textarea id="applyReason" placeholder="Add a short note for your manager"></textarea></div>
      <button class="btn primary" id="applySubmit">Submit request</button>
    </div>`;
  const startEl = document.getElementById('applyStart'), endEl = document.getElementById('applyEnd'), note = document.getElementById('daysNote'), halfDayEl = document.getElementById('applyHalfDay');
  async function preview() {
    if (halfDayEl.checked) endEl.value = startEl.value;
    if (!startEl.value || !endEl.value || endEl.value < startEl.value) { note.textContent = ''; return; }
    try {
      const p = await api('/requests/preview-days', { method: 'POST', body: JSON.stringify({ start: startEl.value, end: endEl.value, halfDay: halfDayEl.checked }) });
      const label = p.days === 0.5 ? 'half a working day' : `${p.days} working day${p.days === 1 ? '' : 's'}`;
      note.textContent = `${label} will be deducted (weekends and holidays excluded)${p.holidays.length ? ' — includes ' + p.holidays.map(h => h.label).join(', ') : ''}.`;
    } catch (e) { note.textContent = e.message; }
  }
  startEl.addEventListener('change', preview); endEl.addEventListener('change', preview);
  halfDayEl.addEventListener('change', () => { endEl.disabled = halfDayEl.checked; preview(); });
  preview();
  document.getElementById('applySubmit').addEventListener('click', async () => {
    const err = document.getElementById('applyErr'); err.style.display = 'none';
    try {
      await api('/requests', { method: 'POST', body: JSON.stringify({ type: document.getElementById('applyType').value, start: startEl.value, end: endEl.value, reason: document.getElementById('applyReason').value, halfDay: halfDayEl.checked }) });
      toast('Leave request submitted.'); state.view = 'requests'; renderView();
    } catch (e) { err.textContent = e.message; err.style.display = 'block'; }
  });
}

/* ---------- requests ---------- */
async function viewRequests() {
  const rows = await api('/requests');
  document.getElementById('main').innerHTML = topbar('Requests', state.user.role === 'manager' ? 'Approve first, then it moves to HR for final sign-off.' : state.user.role === 'hr' ? 'Final sign-off on manager-approved requests.' : 'Track each request through manager and HR approval.') + `
    <div class="card">
      <div class="section-title"><span>All requests <span class="count">${rows.length}</span></span>${state.user.role === 'hr' ? `<button class="btn sm" id="exportCsv">Export CSV</button> <button class="btn sm" id="exportEmpCsv">Export employees</button>` : ''}</div>
      <table><thead><tr><th>Employee</th><th>Type</th><th>Dates</th><th>Days</th><th>Reason</th><th>Status</th><th></th></tr></thead><tbody>
      ${rows.length ? rows.map(r => {
        let actions = '';
        if (state.user.role === 'manager' && r.status === 'pending_manager') actions = `<button class="btn sm approve" data-act="approve" data-id="${r.id}">Approve</button> <button class="btn sm reject" data-act="reject" data-id="${r.id}">Reject</button>`;
        else if (state.user.role === 'hr' && r.status === 'pending_hr') actions = `<button class="btn sm approve" data-act="approve" data-id="${r.id}">Approve</button> <button class="btn sm reject" data-act="reject" data-id="${r.id}">Reject</button>`;
        else if (state.user.role === 'employee' && ['pending_manager','pending_hr'].includes(r.status) && r.employeeId === state.user.id) actions = `<button class="btn sm ghost" data-act="cancel" data-id="${r.id}">Cancel</button>`;
        return `<tr>
          <td><div class="emp-cell">${avatarHtml(r.employeeName, null)}${r.employeeName}</div></td>
          <td>${leaveTag(r.type, r.type[0].toUpperCase()+r.type.slice(1))}</td>
          <td>${r.start} → ${r.end}</td><td>${r.days}</td>
          <td style="color:var(--ink-soft)">${r.reason || '—'}${r.note ? `<div style="font-size:11.5px;color:var(--rust);margin-top:3px;">${r.note}</div>` : ''}
            <details style="margin-top:4px;"><summary style="font-size:11px;color:var(--ink-mute);cursor:pointer;">History</summary>
              <div style="font-size:11px;color:var(--ink-mute);margin-top:4px;">${r.log.map(l => `<div>${l.action.replace(/_/g,' ')}${l.note ? ' — ' + l.note : ''} · ${l.created_at}</div>`).join('')}</div>
            </details></td>
          <td>${badgeEl(r.status)}</td><td>${actions}</td>
        </tr>`;
      }).join('') : `<tr><td class="empty" colspan="7">No requests in view.</td></tr>`}
      </tbody></table></div>`;

  document.querySelectorAll('[data-act]').forEach(b => {
    b.addEventListener('click', async () => {
      const id = b.dataset.id, act = b.dataset.act;
      try {
        if (act === 'approve') { await api(`/requests/${id}/approve`, { method: 'POST' }); toast('Approved.'); }
        else if (act === 'reject') {
          let reason = null;
          while (true) {
            reason = prompt('A reason is required to reject this request:', reason || '');
            if (reason === null) return;
            if (reason.trim()) break;
            alert('A reason is required — please enter one, or cancel.');
          }
          await api(`/requests/${id}/reject`, { method: 'POST', body: JSON.stringify({ reason: reason.trim() }) });
          toast('Request rejected.');
        } else if (act === 'cancel') { await api(`/requests/${id}/cancel`, { method: 'POST' }); toast('Request cancelled.'); }
        renderView();
      } catch (e) { toast(e.message); }
    });
  });
  const exportBtn = document.getElementById('exportCsv');
  if (exportBtn) exportBtn.addEventListener('click', () => downloadViaFetch('/export/requests.csv', 'leave-requests.csv'));
  const exportEmpBtn = document.getElementById('exportEmpCsv');
  if (exportEmpBtn) exportEmpBtn.addEventListener('click', () => downloadViaFetch('/export/employees.csv', 'employees.csv'));
}

async function downloadViaFetch(path, filename) {
  try {
    const token = localStorage.getItem('doin_token');
    const res = await fetch(API_BASE + path, { headers: { Authorization: 'Bearer ' + token } });
    if (!res.ok) throw new Error('Export failed.');
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename; a.click();
    toast('CSV exported.');
  } catch (e) { toast(e.message); }
}

      <div class="form-grid">
        <div class="form-row"><label>Full name</label><input type="text" id="neName" placeholder="e.g. Priya Nair"></div>
        <div class="form-row"><label>Work email</label><input type="email" id="neEmail" placeholder="priya.nair@doin.tech"></div>
        <div class="form-row"><label>Gender</label><select id="neGender"><option value="female">Female</option><option value="male">Male</option></select></div>
        <div class="form-row"><label>Department</label><input type="text" id="neDept" placeholder="e.g. Engineering"></div>
        <div class="form-row"><label>Designation</label><input type="text" id="neDesignation" placeholder="e.g. Senior Developer"></div>
        <div class="form-row"><label>Employee ID</label><input type="text" id="neEmpCode" placeholder="e.g. EMP-042"></div>
        <div class="form-row"><label>Joining date</label><input type="date" id="neJoinDate"></div>
        <div class="form-row"><label>Role</label><select id="neRole"><option value="employee">Employee</option><option value="manager">Manager</option><option value="hr">HR admin</option></select></div>
        <div class="form-row"><label>Reporting to</label><select id="neManager"><option value="">No manager</option>${managers.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select></div>
      </div>
      <button class="btn primary" id="saveNewEmp">Create profile</button>
      <button class="btn ghost" id="cancelAddEmp">Cancel</button>
    </div>` : ''}
    ${canAdd ? `<div class="card" id="bulkImportCard" style="display:none;margin-bottom:14px;">
      <div class="section-title">Set opening balances (bulk)</div>
      <p style="font-size:12.5px;color:var(--ink-mute);margin:0 0 10px;">Paste rows as <code>email,annual,sick,casual</code> (header row optional). Values are days already used this year.</p>
      <textarea id="bulkCsv" placeholder="email,annual,sick,casual
adam.malik54@doin.tech,8,2,1" style="width:100%;min-height:110px;font-family:monospace;font-size:12.5px;padding:10px;border-radius:8px;border:1px solid var(--line);"></textarea>
      <div style="margin-top:10px;"><button class="btn primary" id="runBulkImport">Import</button> <button class="btn ghost" id="cancelBulkImport">Cancel</button></div>
      <div id="bulkImportResults" style="margin-top:12px;"></div>
    </div>` : ''}
    <div class="card"><table><thead><tr><th>Employee</th><th>Designation</th><th>Department</th><th>Employee ID</th><th>Role</th>${canAdd?'<th>Annual left</th><th></th>':''}</tr></thead><tbody>
    ${list.length ? list.map(e => `<tr data-emp-row="${e.id}" style="${e.active === false ? 'opacity:.55;' : ''}">
      <td><div class="emp-cell">${avatarHtml(e.name, e.photo)}${e.name}${e.active === false ? ' <span class="badge rejected" style="margin-left:6px;">Inactive</span>' : ''}</div></td>
      <td style="color:var(--ink-soft)">${e.designation || '—'}</td>
      <td>${e.dept}</td>
      <td style="color:var(--ink-mute)">${e.employee_code || '—'}</td>
      <td style="text-transform:capitalize;color:var(--ink-soft)">${e.role}</td>
      ${canAdd && e.balances ? `<td>${e.balances.annual.total-e.balances.annual.used}</td><td style="white-space:nowrap;"><button class="btn sm" data-edit-profile="${e.id}">Edit</button> <button class="btn sm" data-edit-bal="${e.id}">Balances</button> <button class="btn sm" data-reset-pw="${e.id}">Reset pw</button> <button class="btn sm ${e.active === false ? '' : 'reject'}" data-toggle-status="${e.id}" data-current-active="${e.active !== false}">${e.active === false ? 'Activate' : 'Deactivate'}</button></td>` : (canAdd ? '<td>—</td><td></td>' : '')}
    </tr>${canAdd ? `<tr id="editBalRow-${e.id}" style="display:none;"><td colspan="7" style="background:var(--line-soft);"><div id="editBalContent-${e.id}"></div></td></tr><tr id="editProfileRow-${e.id}" style="display:none;"><td colspan="7" style="background:var(--line-soft);"><div id="editProfileContent-${e.id}"></div></td></tr>` : ''}`).join('') : `<tr><td class="empty" colspan="7">No employees match "${state.search}".</td></tr>`}
    </tbody></table></div>`;

  const search = document.getElementById('teamSearch');
  search.addEventListener('input', e => { state.search = e.target.value; viewTeam(); });
  search.focus(); search.selectionStart = search.value.length;

  const openAdd = document.getElementById('openAddEmp'), addCard = document.getElementById('addEmpCard'), cancelAdd = document.getElementById('cancelAddEmp');
  if (openAdd) openAdd.addEventListener('click', () => { addCard.style.display = 'block'; document.getElementById('neName').focus(); });
  if (cancelAdd) cancelAdd.addEventListener('click', () => { addCard.style.display = 'none'; });
  const saveBtn = document.getElementById('saveNewEmp');
  if (saveBtn) saveBtn.addEventListener('click', async () => {
    const err = document.getElementById('addEmpErr'); err.style.display = 'none';
    const body = {
      name: document.getElementById('neName').value.trim(),
      email: document.getElementById('neEmail').value.trim(),
      gender: document.getElementById('neGender').value,
      dept: document.getElementById('neDept').value.trim(),
      designation: document.getElementById('neDesignation').value.trim(),
      employeeCode: document.getElementById('neEmpCode').value.trim(),
      joiningDate: document.getElementById('neJoinDate').value,
      role: document.getElementById('neRole').value,
      managerId: document.getElementById('neManager').value || null
    };
    if (!body.name || !body.email || !body.dept) { err.textContent = 'Name, email, and department are required.'; err.style.display = 'block'; return; }
    try {
      const res = await api('/employees', { method: 'POST', body: JSON.stringify(body) });
      state.search = '';
      viewTeam();
      const box = document.createElement('div');
      box.className = 'ok-box';
      box.innerHTML = `<b>${body.name} added.</b> Temporary password (copy this now — it won't be shown again): <code style="background:#fff;padding:2px 6px;border-radius:4px;">${res.tempPassword}</code> <button class="btn sm" id="copyTempPw" style="margin-left:8px;">Copy</button>`;
      document.getElementById('main').insertAdjacentElement('afterbegin', box);
      document.getElementById('copyTempPw').addEventListener('click', () => { navigator.clipboard.writeText(res.tempPassword); toast('Copied.'); });
    } catch (e) { err.textContent = e.message; err.style.display = 'block'; }
  });

  document.querySelectorAll('[data-reset-pw]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const empId = btn.dataset.resetPw;
      const emp = employees.find(e => String(e.id) === String(empId));
      if (!confirm(`Reset ${emp.name}'s password? Their old password stops working immediately.`)) return;
      try {
        const res = await api(`/employees/${empId}/reset-password`, { method: 'POST' });
        document.getElementById('main').insertAdjacentHTML('afterbegin', `<div class="ok-box"><b>${emp.name}'s password reset.</b> New temporary password (copy this now): <code style="background:#fff;padding:2px 6px;border-radius:4px;">${res.tempPassword}</code></div>`);
      } catch (e) { toast(e.message); }
    });
  });

  document.querySelectorAll('[data-toggle-status]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const empId = btn.dataset.toggleStatus;
      const currentlyActive = btn.dataset.currentActive === 'true';
      const emp = employees.find(e => String(e.id) === String(empId));
      const msg = currentlyActive ? `Deactivate ${emp.name}? They won't be able to log in, but their records stay intact.` : `Reactivate ${emp.name}?`;
      if (!confirm(msg)) return;
      try {
        const res = await api(`/employees/${empId}/status`, { method: 'PATCH', body: JSON.stringify({ active: !currentlyActive }) });
        toast(`${emp.name} ${currentlyActive ? 'deactivated' : 'activated'}.`);
        if (res.affectedReports > 0) toast(`Note: ${res.affectedReports} employee(s) still report to ${emp.name}.`);
        viewTeam();
      } catch (e) { toast(e.message); }
    });
  });

  document.querySelectorAll('[data-edit-bal]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const empId = btn.dataset.editBal;
      const row = document.getElementById(`editBalRow-${empId}`);
      const content = document.getElementById(`editBalContent-${empId}`);
      const isOpen = row.style.display !== 'none';
      if (isOpen) { row.style.display = 'none'; return; }
      const emp = employees.find(e => String(e.id) === String(empId));
      const bal = emp.balances || {};
      content.innerHTML = `<div style="padding:12px;">
        <div style="font-weight:600;font-size:12.5px;margin-bottom:8px;">Edit ${emp.name}'s used days</div>
        <div style="display:flex;flex-wrap:wrap;gap:10px;">
          ${LEAVE_CODES.filter(c => bal[c]).map(c => `<div><label style="display:block;font-size:11px;color:var(--ink-mute);text-transform:capitalize;">${c}</label><input type="number" step="0.5" min="0" data-bal-input="${c}" value="${bal[c].used}" style="width:70px;padding:6px;border-radius:6px;border:1px solid var(--line);"></div>`).join('')}
        </div>
        <div class="err-box" id="editBalErr-${empId}" style="margin-top:10px;"></div>
        <button class="btn primary sm" id="saveBal-${empId}" style="margin-top:10px;">Save changes</button>
      </div>`;
      row.style.display = 'table-row';
      document.getElementById(`saveBal-${empId}`).addEventListener('click', async () => {
        const err = document.getElementById(`editBalErr-${empId}`); err.style.display = 'none';
        try {
          for (const inp of content.querySelectorAll('[data-bal-input]')) {
            const code = inp.dataset.balInput, newVal = Number(inp.value);
            if (newVal !== bal[code].used) await api(`/employees/${empId}/balances`, { method: 'PATCH', body: JSON.stringify({ typeCode: code, used: newVal, reason: 'Manual edit via Team directory' }) });
          }
          toast('Balances updated.'); viewTeam();
        } catch (e) { err.textContent = e.message; err.style.display = 'block'; }
      });
    });
  });

  document.querySelectorAll('[data-edit-profile]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const empId = btn.dataset.editProfile;
      const row = document.getElementById(`editProfileRow-${empId}`);
      const content = document.getElementById(`editProfileContent-${empId}`);
      const isOpen = row.style.display !== 'none';
      if (isOpen) { row.style.display = 'none'; return; }
      const emp = employees.find(e => String(e.id) === String(empId));
      content.innerHTML = `<div style="padding:12px;max-width:680px;">
        <div style="font-weight:600;font-size:12.5px;margin-bottom:10px;">Edit ${emp.name}'s profile</div>
        <div class="form-grid">
          <div class="form-row"><label>Full name</label><input type="text" id="epName-${empId}" value="${emp.name}"></div>
          <div class="form-row"><label>Department</label><input type="text" id="epDept-${empId}" value="${emp.dept}"></div>
          <div class="form-row"><label>Designation</label><input type="text" id="epDesignation-${empId}" value="${emp.designation || ''}"></div>
          <div class="form-row"><label>Employee ID</label><input type="text" id="epEmpCode-${empId}" value="${emp.employee_code || ''}"></div>
          <div class="form-row"><label>Role</label><select id="epRole-${empId}"><option value="employee" ${emp.role==='employee'?'selected':''}>Employee</option><option value="manager" ${emp.role==='manager'?'selected':''}>Manager</option><option value="hr" ${emp.role==='hr'?'selected':''}>HR admin</option></select></div>
          <div class="form-row"><label>Reporting to</label><select id="epManager-${empId}"><option value="">No manager</option>${managers.filter(m=>m.id!==emp.id).map(m=>`<option value="${m.id}" ${emp.manager_id===m.id?'selected':''}>${m.name}</option>`).join('')}</select></div>
        </div>
        <div class="err-box" id="editProfileErr-${empId}" style="margin-top:6px;"></div>
        <button class="btn primary sm" id="saveProfile-${empId}">Save changes</button>
      </div>`;
      row.style.display = 'table-row';
      document.getElementById(`saveProfile-${empId}`).addEventListener('click', async () => {
        const err = document.getElementById(`editProfileErr-${empId}`); err.style.display = 'none';
        try {
          await api(`/employees/${empId}`, { method: 'PATCH', body: JSON.stringify({
            name: document.getElementById(`epName-${empId}`).value,
            dept: document.getElementById(`epDept-${empId}`).value,
            designation: document.getElementById(`epDesignation-${empId}`).value,
            employeeCode: document.getElementById(`epEmpCode-${empId}`).value,
            role: document.getElementById(`epRole-${empId}`).value,
            managerId: document.getElementById(`epManager-${empId}`).value || null
          }) });
          toast('Profile updated.'); viewTeam();
        } catch (e) { err.textContent = e.message; err.style.display = 'block'; }
      });
    });
  });

  const openBulk = document.getElementById('openBulkImport'), bulkCard = document.getElementById('bulkImportCard'), cancelBulk = document.getElementById('cancelBulkImport');
  if (openBulk) openBulk.addEventListener('click', () => { bulkCard.style.display = 'block'; document.getElementById('bulkCsv').focus(); });
  if (cancelBulk) cancelBulk.addEventListener('click', () => { bulkCard.style.display = 'none'; });
  const runBulk = document.getElementById('runBulkImport');
  if (runBulk) runBulk.addEventListener('click', async () => {
    const raw = document.getElementById('bulkCsv').value.trim();
    const resultsBox = document.getElementById('bulkImportResults');
    if (!raw) { toast('Paste some rows first.'); return; }
    const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
    let headerCols = null; const rows = [];
    for (const line of lines) {
      const parts = line.split(',').map(p => p.trim());
      if (parts[0].toLowerCase() === 'email') { headerCols = parts.map(p => p.toLowerCase()); continue; }
      if (!headerCols) headerCols = ['email','annual','sick','casual'].slice(0, parts.length);
      const row = {}; headerCols.forEach((col, i) => { if (parts[i] !== undefined && parts[i] !== '') row[col] = parts[i]; });
      rows.push(row);
    }
    runBulk.disabled = true; runBulk.innerHTML = '<span class="spinner"></span>Importing…';
    try {
      const res = await api('/employees/import-balances', { method: 'POST', body: JSON.stringify({ rows, reason: 'Bulk opening-balance import' }) });
      const okCount = res.results.filter(r => r.ok).length, failCount = res.results.length - okCount;
      resultsBox.innerHTML = `<div style="font-size:12.5px;margin-bottom:6px;"><b>${okCount} row(s) applied</b>${failCount ? `, ${failCount} failed` : ''}.</div>` + res.results.map(r => `<div style="font-size:11.5px;color:${r.ok ? 'var(--success)' : 'var(--rust)'};">${r.email} — ${r.ok ? 'updated ' + r.updated.join(', ') : r.error}</div>`).join('');
      toast('Import finished.');
      if (okCount > 0) {
        const fresh = await api('/employees');
        fresh.forEach(fe => {
          const row = document.querySelector(`[data-emp-row="${fe.id}"]`);
          if (row && fe.balances) { const cells = row.querySelectorAll('td'); if (cells[5]) cells[5].textContent = fe.balances.annual.total - fe.balances.annual.used; }
        });
      }
    } catch (e) { resultsBox.innerHTML = `<div class="err-box" style="display:block;">${e.message}</div>`; }
    runBulk.disabled = false; runBulk.textContent = 'Import';
  });
}

/* ---------- calendar ---------- */
async function viewCalendar() {
  const y = state.calYear, m = state.calMonth;
  const first = new Date(y, m, 1);
  const startBlank = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const monthStart = fmt(new Date(y, m, 1)), monthEnd = fmt(new Date(y, m, daysInMonth));
  const feed = await api(`/requests/calendar?start=${monthStart}&end=${monthEnd}`);
  const today = fmt(new Date());
  const monthName = first.toLocaleString('en-US', { month: 'long', year: 'numeric' });
  let cells = '';
  for (let i = 0; i < startBlank; i++) cells += `<div class="cal-cell blank"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = fmt(new Date(y, m, d));
    const onLeave = feed.filter(r => r.start <= dateStr && r.end >= dateStr);
    const isToday = dateStr === today;
    cells += `<div class="cal-cell ${onLeave.length ? 'on' : ''}" title="${onLeave.map(r => r.name).join(', ')}" style="${isToday ? 'outline:2px solid var(--rust);outline-offset:1px;' : ''}">${d}${onLeave.length ? `<div style="font-size:9px;margin-top:2px;">${onLeave.length} out</div>` : ''}</div>`;
  }
  document.getElementById('main').innerHTML = topbar('Leave calendar', 'Who is out, at a glance.') + `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <button class="btn sm" id="calPrev">← Prev</button>
        <div style="font-weight:600;font-size:14px;">${monthName}</div>
        <button class="btn sm" id="calNext">Next →</button>
      </div>
      <div class="legend"><span><span class="leave-dot" style="background:var(--success)"></span> Days with approved leave</span><span style="outline:2px solid var(--rust);outline-offset:1px;padding:0 4px;border-radius:3px;">Today</span></div>
      <div class="cal-grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<div class="cal-head">${d}</div>`).join('')}${cells}</div>
    </div>`;
  document.getElementById('calPrev').addEventListener('click', () => { state.calMonth--; if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; } viewCalendar(); });
  document.getElementById('calNext').addEventListener('click', () => { state.calMonth++; if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; } viewCalendar(); });
}

/* ---------- holidays ---------- */
async function viewHolidays() {
  const holidays = await api('/holidays');
  const canManage = state.user.role === 'hr';
  const today = fmt(new Date());
  const upcoming = holidays.filter(h => h.date >= today);
  const past = holidays.filter(h => h.date < today).sort((a,b) => b.date.localeCompare(a.date));
  document.getElementById('main').innerHTML = topbar('Holidays', 'Company holidays are excluded from leave-day counts.') + `
    ${canManage ? `<div class="card" style="max-width:520px;margin-bottom:14px;">
      <div class="section-title">Add a holiday</div>
      <div class="form-grid">
        <div class="form-row"><label>Date</label><input type="date" id="holDate"></div>
        <div class="form-row"><label>Label</label><input type="text" id="holLabel" placeholder="e.g. Eid-ul-Fitr"></div>
      </div>
      <button class="btn primary" id="holSave">Add holiday</button>
    </div>` : ''}
    <div class="card"><div class="section-title">Upcoming <span class="count">${upcoming.length}</span></div>
      <table><tbody>${upcoming.length ? upcoming.map(h => `<tr><td>${h.date}</td><td>${h.label}</td>${canManage ? `<td style="text-align:right;"><button class="btn sm ghost" data-del="${h.date}">Remove</button></td>` : '<td></td>'}</tr>`).join('') : '<tr><td class="empty">No upcoming holidays on file.</td></tr>'}</tbody></table>
    </div>
    ${past.length ? `<div class="card" style="margin-top:14px;"><div class="section-title">Past this year <span class="count">${past.length}</span></div>
      <table><tbody>${past.map(h => `<tr><td style="color:var(--ink-mute)">${h.date}</td><td style="color:var(--ink-mute)">${h.label}</td>${canManage ? `<td style="text-align:right;"><button class="btn sm ghost" data-del="${h.date}">Remove</button></td>` : '<td></td>'}</tr>`).join('')}</tbody></table>
    </div>` : ''}`;
  const saveBtn = document.getElementById('holSave');
  if (saveBtn) saveBtn.addEventListener('click', async () => {
    const date = document.getElementById('holDate').value, label = document.getElementById('holLabel').value.trim();
    if (!date || !label) { toast('Enter both a date and a label.'); return; }
    try { await api('/holidays', { method: 'POST', body: JSON.stringify({ date, label }) }); toast('Holiday added.'); viewHolidays(); }
    catch (e) { toast(e.message); }
  });
  document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
    try { await api(`/holidays/${b.dataset.del}`, { method: 'DELETE' }); toast('Holiday removed.'); viewHolidays(); }
    catch (e) { toast(e.message); }
  }));
}

boot();

</script>
